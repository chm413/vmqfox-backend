name: Publish Go backend image

on:
  workflow_dispatch:
  push:
    tags:
      # 仓库历史 tag 为大写 V（V2.0 / V3.0 / V3.1），此处两种写法都收，
      # 避免大小写敏感导致打了 tag 却不触发镜像构建。
      - "v*"
      - "V*"

permissions:
  contents: read
  # 推送到 GitHub Container Registry 需要 packages:write；
  # 认证直接用内置 GITHUB_TOKEN，无需再配置 DOCKER_USERNAME / DOCKER_PASSWORD。
  packages: write

env:
  IMAGE_NAME: vmqfox-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的镜像路径必须全小写，而 github.repository_owner 会保留账号原有大小写，
      # 这里统一转小写，避免出现 "invalid reference format"。
      - name: Resolve image reference
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=go-dev
            type=sha,prefix=go-
            type=ref,event=tag,prefix=go-

      # Dockerfile 的 web-builder 阶段会从 web/ 源码重新构建前端并校验资源完整性，
      # 因此镜像内嵌入的一定是本次提交的产物，而非本地忽略目录中的旧 static/out。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
