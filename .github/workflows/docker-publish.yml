name: Publish Go backend image

# 所有第三方 Action 一律固定到 commit SHA，不用 @v4 这类可变 tag。
# 可变 tag 允许上游在不改动本文件一行代码的情况下替换实际执行的内容，
# 而本 workflow 持有 packages:write —— 一旦被投毒即可推送恶意镜像。
# 行尾注释保留可读的版本号，由 .github/dependabot.yml 的 github-actions
# 生态自动更新 SHA 与注释；升版本会以 PR 形式出现，可审可测。
# 手动升级请勿写回 @vX，务必查真实 SHA：
#   git ls-remote --tags https://github.com/<owner>/<repo> 'v<major>.*'

on:
  workflow_dispatch:
  push:
    tags:
      # 仓库历史 tag 为大写 V（V2.0 / V3.0 / V3.1），此处两种写法都收，
      # 避免大小写敏感导致打了 tag 却不触发镜像构建。
      - "v*"
      - "V*"

permissions:
  contents: read
  # 推送到 GitHub Container Registry 需要 packages:write；
  # 认证直接用内置 GITHUB_TOKEN，无需再配置 DOCKER_USERNAME / DOCKER_PASSWORD。
  packages: write

env:
  IMAGE_NAME: vmqfox-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # GHCR 的镜像路径必须全小写，而 github.repository_owner 会保留账号原有大小写，
      # 这里统一转小写，避免出现 "invalid reference format"。
      - name: Resolve image reference
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=go-dev
            type=sha,prefix=go-
            type=ref,event=tag,prefix=go-

      # Dockerfile 的 web-builder 阶段会从 web/ 源码重新构建前端并校验资源完整性，
      # 因此镜像内嵌入的一定是本次提交的产物，而非本地忽略目录中的旧 static/out。
      #
      # 只构建 linux/amd64。此前同时构建 linux/arm64 时，arm64 那一路必须全程
      # 运行在 QEMU 模拟下（esbuild 原生 postinstall 会 SIGILL，registry 请求
      # 退化到 10~20 秒/条），单架构构建可完全避开这条路径，也就不再需要 QEMU。
      # 若将来要恢复 arm64：在本行加回 ,linux/arm64 并重新加上 setup-qemu 步骤即可，
      # Dockerfile 已固定 BUILDPLATFORM，前端不会因此被重复构建。
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 托管 runner 每次都是全新 VM，本地层缓存不跨运行保留，
          # 用 gha 后端把 BuildKit 的层缓存存到 Actions 缓存里。
          cache-from: type=gha
          cache-to: type=gha,mode=max
