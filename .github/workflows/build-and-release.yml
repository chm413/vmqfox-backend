name: Build and release Go backend

# 所有第三方 Action 一律固定到 commit SHA，不用 @v4 这类可变 tag。
# 本 workflow 持有 contents:write，能改写 Release 附件乃至覆盖已发布的二进制；
# 可变 tag 一旦被上游替换，攻击者即可向所有下游用户下发带后门的产物。
# 行尾注释保留可读版本号，由 .github/dependabot.yml 自动维护。

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "为版本创建一个标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26.11"
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"
  GOFLAGS: "-mod=mod"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # 固定到 v4.3.0 的 SHA：仓库中 @v4 浮动 tag 当前实际指向的正是这个提交，
      # 冻结在现状不会引入行为变化。最新的 v4.4.0 交给 Dependabot 单独开 PR 升级。
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 先构建前端：产物写入 internal/http/static/out，供后续 go:embed 使用。
      # 发布包不允许依赖仓库忽略目录中的旧 static/out。
      - name: Build embedded React frontend
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify embedded asset integrity
        shell: bash
        run: |
          set -euo pipefail
          out=internal/http/static/out
          test -f "$out/index.html" || { echo "构建产物缺少 index.html"; exit 1; }
          grep -oE '(src|href)="/assets/[^"]+"' "$out/index.html" \
            | sed -E 's#^[a-z]+="/assets/(.*)"$#\1#' \
            | sort -u > referenced-assets.txt
          test -s referenced-assets.txt || { echo "index.html 未引用任何 assets 资源"; exit 1; }
          while read -r asset; do
            test -f "$out/assets/$asset" || { echo "index.html 引用的资源缺失: $asset"; exit 1; }
            echo "已校验前端资源: $asset"
          done < referenced-assets.txt
          rm -f referenced-assets.txt

      - name: Resolve Go modules
        run: go mod download

      - name: Static analysis and tests
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      # 交叉编译四平台产物：linux 与 windows 各 amd64/arm64。
      # 依赖均为纯 Go 实现（CGO_ENABLED=0），Windows 产物带 .exe 后缀。
      - name: Build multi-platform binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/vmqfox-api-linux-$arch" ./cmd/vmqfox-api
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/vmqfox-api-windows-$arch.exe" ./cmd/vmqfox-api
          done
          cp database/schema.sql env.example dist/
          tar -czf "vmqfox-backend-${{ inputs.tag_name }}.tar.gz" -C dist .

      # overwrite_files 允许对同一 tag 重复发布时直接替换旧包（如修订 V3.0）
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ inputs.tag_name }}
          overwrite_files: true
          files: vmqfox-backend-${{ inputs.tag_name }}.tar.gz
